[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-dllm"
version = "0.1.0"
description = "Jev-guided answer selection and trajectory pruning for a fixed dLLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jev-dllm = "jev_dllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
